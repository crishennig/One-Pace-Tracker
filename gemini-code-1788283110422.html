<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Pace Progress Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --completed: #22c55e;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 800px; }
    header {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    h1 { margin: 0 0 10px 0; color: var(--accent); font-size: 1.5rem; }
    .progress-bar-bg {
      background: var(--border);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-bar-fill { background: var(--completed); height: 100%; width: 0%; transition: width 0.3s; }
    .stats { font-size: 0.9rem; color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>One Pace Tracker</h1>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <div class="stats" id="completed-count">Carregando progresso...</div>
    </header>

    <div id="app-content"></div>
  </div>

  <script>
    // Registro do PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker Registrado com Sucesso!'))
          .catch((err) => console.log('Erro no PWA:', err));
      });
    }
  </script>
</body>
</html>
