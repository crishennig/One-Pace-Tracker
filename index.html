<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Pace Progress Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .saga {
            background: var(--card-bg);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .saga h2 {
            margin-top: 0;
            font-size: 1.25rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            color: var(--text-color);
        }

        .arc-wrapper {
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.4);
        }

        .arc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: rgba(30, 41, 59, 0.8);
            padding: 12px 16px;
            transition: background 0.2s;
            user-select: none;
        }

        .arc-header:hover {
            background: rgba(51, 65, 85, 0.8);
        }

        .arc-title-area {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .arc-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .arc-progress-text {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .arc-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-mark-arc {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-mark-arc:hover {
            background-color: var(--accent);
            color: #0f172a;
        }

        .arc-content {
            display: none;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }

        .arc-content.active {
            display: block;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid rgba(51, 65, 85, 0.5);
            transition: border-color 0.2s, background-color 0.2s;
        }

        li.completed {
            background-color: var(--success-bg);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .ep-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .ep-info input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--success);
            cursor: pointer;
        }

        .ep-info span {
            font-size: 0.9rem;
        }

        li.completed .ep-info span {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(15, 23, 42, 0.6);
            padding: 3px 8px;
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            .arc-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .arc-actions {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>One Pace Progress Tracker</h1>
            <button id="export-btn">Exportar CSV</button>
        </header>

        <div id="app"></div>
    </div>

    <!-- Script de Dados -->
    <script src="data.js"></script>

    <!-- Script de Lógica e Funcionalidades -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('app');
            const exportBtn = document.getElementById('export-btn');

            if (typeof data === 'undefined' || !Array.isArray(data)) {
                container.innerHTML = '<p style="color: #ef4444; font-weight: bold; text-align: center;">Erro: O arquivo data.js não foi carregado corretamente.</p>';
                return;
            }

            let progress = JSON.parse(localStorage.getItem('onePaceProgress')) || {};

            function saveProgress() {
                localStorage.setItem('onePaceProgress', JSON.stringify(progress));
            }

            function renderApp() {
                container.innerHTML = '';

                data.forEach((sagaItem) => {
                    const sagaDiv = document.createElement('div');
                    sagaDiv.className = 'saga';
                    
                    const sagaTitle = document.createElement('h2');
                    sagaTitle.textContent = sagaItem.saga;
                    sagaDiv.appendChild(sagaTitle);

                    sagaItem.arcs.forEach((arcItem) => {
                        const arcWrapper = document.createElement('div');
                        arcWrapper.className = 'arc-wrapper';
                        
                        const arcHeader = document.createElement('div');
                        arcHeader.className = 'arc-header';
                        
                        // Conta quantos episódios do arco estão concluídos
                        const completedCount = arcItem.episodes.filter(ep => progress[ep]?.completed).length;
                        
                        const titleArea = document.createElement('div');
                        titleArea.className = 'arc-title-area';
                        
                        const arcTitleSpan = document.createElement('span');
                        arcTitleSpan.className = 'arc-title';
                        arcTitleSpan.textContent = arcItem.name;
                        
                        const progressText = document.createElement('span');
                        progressText.className = 'arc-progress-text';
                        progressText.textContent = `${completedCount} / ${arcItem.total_episodes} episódios concluídos`;
                        
                        titleArea.appendChild(arcTitleSpan);
                        titleArea.appendChild(progressText);

                        const arcActions = document.createElement('div');
                        arcActions.className = 'arc-actions';

                        const markArcBtn = document.createElement('button');
                        markArcBtn.className = 'btn-mark-arc';
                        markArcBtn.textContent = completedCount === arcItem.total_episodes ? 'Desmarcar Arco' : 'Marcar Arco';
                        markArcBtn.type = 'button';

                        // Bulk "Mark Arc"
                        markArcBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const allChecked = completedCount === arcItem.total_episodes;
                            
                            arcItem.episodes.forEach(ep => {
                                if (!progress[ep]) progress[ep] = {};
                                progress[ep].completed = !allChecked;
                                delete progress[ep].timestamp; // Mantém a regra de bulk actions sem timestamp
                            });

                            saveProgress();
                            renderApp();
                        });

                        arcActions.appendChild(markArcBtn);
                        arcHeader.appendChild(titleArea);
                        arcHeader.appendChild(arcActions);

                        const arcContent = document.createElement('div');
                        arcContent.className = 'arc-content';

                        // Toggle colapso do arco
                        arcHeader.addEventListener('click', () => {
                            arcContent.classList.toggle('active');
                        });

                        const ul = document.createElement('ul');
                        arcItem.episodes.forEach(epName => {
                            const isCompleted = progress[epName]?.completed || false;
                            const li = document.createElement('li');
                            if (isCompleted) li.classList.add('completed');
                            
                            const epInfo = document.createElement('label');
                            epInfo.className = 'ep-info';

                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            checkbox.checked = isCompleted;

                            checkbox.addEventListener('change', () => {
                                if (!progress[epName]) progress[epName] = {};
                                progress[epName].completed = checkbox.checked;
                                
                                if (checkbox.checked) {
                                    const now = new Date();
                                    progress[epName].timestamp = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                                } else {
                                    delete progress[epName].timestamp;
                                }

                                saveProgress();
                                renderApp();
                            });

                            const label = document.createElement('span');
                            label.textContent = epName;

                            epInfo.appendChild(checkbox);
                            epInfo.appendChild(label);

                            const timeSpan = document.createElement('span');
                            timeSpan.className = 'timestamp';
                            timeSpan.textContent = progress[epName]?.timestamp || '';

                            li.appendChild(epInfo);
                            li.appendChild(timeSpan);
                            ul.appendChild(li);
                        });

                        arcContent.appendChild(ul);
                        arcWrapper.appendChild(arcHeader);
                        arcWrapper.appendChild(arcContent);
                        sagaDiv.appendChild(arcWrapper);
                    });

                    container.appendChild(sagaDiv);
                });
            }

            exportBtn.addEventListener('click', () => {
                let csvContent = "data:text/csv;charset=utf-8,Episodio,Status,Data/Hora\n";
                
                data.forEach(saga => {
                    saga.arcs.forEach(arc => {
                        arc.episodes.forEach(ep => {
                            const completed = progress[ep]?.completed ? 'Concluído' : 'Pendente';
                            const timestamp = progress[ep]?.timestamp || '';
                            csvContent += `"${ep}","${completed}","${timestamp}"\n`;
                        });
                    });
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement('a');
                link.setAttribute('href', encodedUri);
                link.setAttribute('download', 'one_pace_progresso.csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });

            renderApp();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado!', reg))
                    .catch(err => console.log('Erro no Service Worker:', err));
            });
        }
    </script>
</body>
</html>
