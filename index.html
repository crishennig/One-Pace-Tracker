<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Pace Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --header-bg: #334155;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 25px;
        }

        .stats-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: var(--bg-color);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-box small {
            color: var(--text-muted);
            font-size: 0.85rem;
            display: block;
        }

        .stat-box span {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
            margin-top: 4px;
            display: block;
        }

        .progress-bar-container {
            background: var(--bg-color);
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        .progress-bar {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .actions-panel {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        .saga-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .saga-header {
            background: var(--header-bg);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .saga-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--accent);
        }

        .saga-content {
            padding: 15px;
        }

        .saga-content.collapsed, .arc-content.collapsed {
            display: none;
        }

        .arc-section {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .arc-header {
            background: #1a2234;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .arc-header h3 {
            margin: 0;
            font-size: 0.95rem;
            color: #38bdf8;
        }

        .arc-content {
            padding: 12px 15px;
        }

        .arc-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-small {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-small:hover {
            background: var(--border);
        }

        .episode-item {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .episode-item:last-child {
            border-bottom: none;
        }

        .episode-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .episode-item.watched span.ep-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--success);
            margin-left: 8px;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>One Pace Tracker</h1>

        <div class="stats-panel">
            <div class="stats-grid">
                <div class="stat-box">
                    <small>Tempo Total</small>
                    <span id="total-time">00:00:00</span>
                </div>
                <div class="stat-box">
                    <small>Assistido</small>
                    <span id="watched-time" style="color: var(--success);">00:00:00</span>
                </div>
                <div class="stat-box">
                    <small>Restante</small>
                    <span id="remaining-time" style="color: var(--danger);">00:00:00</span>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted);">
                <span>Progresso Geral</span>
                <span id="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="actions-panel">
            <button class="btn" id="export-csv">Exportar CSV (UTF-8)</button>
        </div>

        <div id="tracker-app"></div>
    </div>

    <script src="data.js"></script>
    <script src="durations.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const appContainer = document.getElementById("tracker-app");
            let watchedData = JSON.parse(localStorage.getItem("onePaceWatchedData")) || {};
            
            // Controle de estado para manter o que estava aberto/fechado ao renderizar novamente
            let collapsedSagas = {};
            let collapsedArcs = {};

            function getEpisodeDuration(fullEpisodeTitle) {
                const baseName = fullEpisodeTitle.split(" - ")[0].trim();
                return episodeDurations[baseName] || "00:24:00";
            }

            function timeToSeconds(timeStr) {
                const parts = timeStr.split(":").map(Number);
                if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
                if (parts.length === 2) return parts[0] * 60 + parts[1];
                return 0;
            }

            function secondsToTime(totalSeconds) {
                const hrs = Math.floor(totalSeconds / 3600);
                const mins = Math.floor((totalSeconds % 3600) / 60);
                const secs = totalSeconds % 60;
                return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            function updateStats() {
                let totalSec = 0;
                let watchedSec = 0;
                let totalEpCount = 0;
                let watchedEpCount = 0;

                if (typeof arcsData === 'undefined') return;

                arcsData.forEach(saga => {
                    if (saga.arcs) {
                        saga.arcs.forEach(arc => {
                            if (arc.episodes) {
                                arc.episodes.forEach(ep => {
                                    totalEpCount++;
                                    const durationStr = getEpisodeDuration(ep);
                                    const sec = timeToSeconds(durationStr);
                                    totalSec += sec;
                                    if (watchedData[ep] && watchedData[ep].watched) {
                                        watchedSec += sec;
                                        watchedEpCount++;
                                    }
                                });
                            }
                        });
                    }
                });

                const remainingSec = totalSec - watchedSec;
                const percent = totalEpCount > 0 ? Math.round((watchedEpCount / totalEpCount) * 100) : 0;

                document.getElementById("total-time").textContent = secondsToTime(totalSec);
                document.getElementById("watched-time").textContent = secondsToTime(watchedSec);
                document.getElementById("remaining-time").textContent = secondsToTime(remainingSec);
                document.getElementById("progress-percentage").textContent = `${percent}% (${watchedEpCount}/${totalEpCount} eps)`;
                document.getElementById("progress-bar").style.width = `${percent}%`;
            }

            function renderApp() {
                appContainer.innerHTML = "";

                if (typeof arcsData === 'undefined') {
                    appContainer.innerHTML = "<p style='color: var(--danger); text-align:center;'>Erro: O arquivo data.js não foi carregado corretamente.</p>";
                    return;
                }

                arcsData.forEach((sagaGroup, sIndex) => {
                    const sagaKey = `saga_${sIndex}`;
                    const sagaDiv = document.createElement("div");
                    sagaDiv.className = "saga-section";

                    const sagaHeader = document.createElement("div");
                    sagaHeader.className = "saga-header";
                    
                    const sagaTitle = document.createElement("h2");
                    sagaTitle.textContent = sagaGroup.saga || `Saga ${sIndex + 1}`;

                    const sagaToggleBtn = document.createElement("button");
                    sagaToggleBtn.className = "toggle-btn";
                    
                    const sagaContent = document.createElement("div");
                    sagaContent.className = "saga-content";

                    if (collapsedSagas[sagaKey]) {
                        sagaContent.classList.add("collapsed");
                        sagaToggleBtn.textContent = "▶ Expandir";
                    } else {
                        sagaToggleBtn.textContent = "▼ Minimizar";
                    }

                    sagaHeader.appendChild(sagaTitle);
                    sagaHeader.appendChild(sagaToggleBtn);

                    if (sagaGroup.arcs && Array.isArray(sagaGroup.arcs)) {
                        sagaGroup.arcs.forEach((arc, aIndex) => {
                            const arcKey = `saga_${sIndex}_arc_${aIndex}`;
                            const arcDiv = document.createElement("div");
                            arcDiv.className = "arc-section";

                            const arcHeader = document.createElement("div");
                            arcHeader.className = "arc-header";
                            
                            const arcTitle = document.createElement("h3");
                            arcTitle.textContent = arc.title || arc.name;

                            const arcActions = document.createElement("div");
                            arcActions.className = "arc-actions";

                            const checkAllBtn = document.createElement("button");
                            checkAllBtn.className = "btn-small";
                            checkAllBtn.textContent = "Marcar Arco";
                            checkAllBtn.title = "Marca todos os episódios do arco sem data/hora";

                            checkAllBtn.addEventListener("click", (e) => {
                                e.stopPropagation();
                                const allWatched = arc.episodes.every(ep => watchedData[ep] && watchedData[ep].watched);
                                
                                arc.episodes.forEach(ep => {
                                    if (!allWatched) {
                                        watchedData[ep] = { watched: true, timestamp: null };
                                    } else {
                                        delete watchedData[ep];
                                    }
                                });

                                localStorage.setItem("onePaceWatchedData", JSON.stringify(watchedData));
                                updateStats();
                                renderApp();
                            });

                            const arcToggleBtn = document.createElement("button");
                            arcToggleBtn.className = "toggle-btn";

                            const arcContent = document.createElement("div");
                            arcContent.className = "arc-content";

                            if (collapsedArcs[arcKey]) {
                                arcContent.classList.add("collapsed");
                                arcToggleBtn.textContent = "▶";
                            } else {
                                arcToggleBtn.textContent = "▼";
                            }

                            arcActions.appendChild(checkAllBtn);
                            arcActions.appendChild(arcToggleBtn);

                            arcHeader.appendChild(arcTitle);
                            arcHeader.appendChild(arcActions);

                            if (arc.episodes && Array.isArray(arc.episodes)) {
                                arc.episodes.forEach(ep => {
                                    const epDiv = document.createElement("div");
                                    epDiv.className = "episode-item";
                                    const isWatched = watchedData[ep] && watchedData[ep].watched;
                                    if (isWatched) epDiv.classList.add("watched");

                                    const duration = getEpisodeDuration(ep);

                                    const label = document.createElement("label");
                                    label.className = "episode-info";
                                    
                                    const checkbox = document.createElement("input");
                                    checkbox.type = "checkbox";
                                    checkbox.checked = isWatched;
                                    
                                    checkbox.addEventListener("change", () => {
                                        if (checkbox.checked) {
                                            const now = new Date();
                                            const formattedDate = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                                            watchedData[ep] = { watched: true, timestamp: formattedDate };
                                        } else {
                                            delete watchedData[ep];
                                        }
                                        localStorage.setItem("onePaceWatchedData", JSON.stringify(watchedData));
                                        updateStats();
                                        renderApp();
                                    });

                                    const spanText = document.createElement("span");
                                    spanText.className = "ep-title";
                                    spanText.textContent = ep;

                                    if (isWatched && watchedData[ep].timestamp) {
                                        const tsSpan = document.createElement("span");
                                        tsSpan.className = "timestamp";
                                        tsSpan.textContent = `(${watchedData[ep].timestamp})`;
                                        spanText.appendChild(tsSpan);
                                    }

                                    label.appendChild(checkbox);
                                    label.appendChild(spanText);

                                    const smallDuration = document.createElement("small");
                                    smallDuration.style.color = "var(--text-muted)";
                                    smallDuration.textContent = duration;

                                    epDiv.appendChild(label);
                                    epDiv.appendChild(smallDuration);
                                    arcContent.appendChild(epDiv);
                                });
                            }

                            arcHeader.addEventListener("click", () => {
                                arcContent.classList.toggle("collapsed");
                                const isCollapsed = arcContent.classList.contains("collapsed");
                                collapsedArcs[arcKey] = isCollapsed;
                                arcToggleBtn.textContent = isCollapsed ? "▶" : "▼";
                            });

                            arcDiv.appendChild(arcHeader);
                            arcDiv.appendChild(arcContent);
                            sagaContent.appendChild(arcDiv);
                        });
                    }

                    sagaHeader.addEventListener("click", () => {
                        sagaContent.classList.toggle("collapsed");
                        const isCollapsed = sagaContent.classList.contains("collapsed");
                        collapsedSagas[sagaKey] = isCollapsed;
                        sagaToggleBtn.textContent = isCollapsed ? "▶ Expandir" : "▼ Minimizar";
                    });

                    sagaDiv.appendChild(sagaHeader);
                    sagaDiv.appendChild(sagaContent);
                    appContainer.appendChild(sagaDiv);
                });
            }

            document.getElementById("export-csv").addEventListener("click", () => {
                let csvContent = "\uFEFFSaga,Arco,Episodio,Assistido,DataHora\n";

                arcsData.forEach(saga => {
                    if (saga.arcs) {
                        saga.arcs.forEach(arc => {
                            if (arc.episodes) {
                                arc.episodes.forEach(ep => {
                                    const record = watchedData[ep];
                                    const watchedStatus = record && record.watched ? "Sim" : "Nao";
                                    const timestamp = record && record.timestamp ? record.timestamp : "";
                                    csvContent += `"${saga.saga}","${arc.title || arc.name}","${ep}","${watchedStatus}","${timestamp}"\n`;
                                });
                            }
                        });
                    }
                });

                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "one_pace_progresso.csv";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });

            updateStats();
            renderApp();
        });
    </script>
</body>
</html>
